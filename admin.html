<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Painel Administrativo - Itinerâncias</title>
    <link rel="stylesheet" href="style.css">
    <style>
        body { background-color: var(--color-gold); } 
        main { padding-top: 100px; display: flex; justify-content: center; min-height: 100vh; }
        #login-screen { display: flex; flex-direction: column; align-items: center; justify-content: center; width: 100%; height: 80vh; }
        .login-box { background: var(--bg-glass-light); padding: 40px; border-radius: 8px; border: 1px solid rgba(28,17,10,0.2); width: 100%; max-width: 400px; text-align: center; }
        .login-box input { margin-bottom: 20px; text-align: center; }
        #admin-panel { display: none; width: 100%; max-width: 900px; }
        .admin-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 30px; border-bottom: 1px solid var(--color-accent); padding-bottom: 20px; }
        .dashboard-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 30px; }
        @media(max-width: 768px) { .dashboard-grid { grid-template-columns: 1fr; } }
        .upload-area { border: 2px dashed rgba(28,17,10,0.5); padding: 40px; text-align: center; border-radius: 8px; transition: 0.3s; background: rgba(255,255,255,0.5); cursor: pointer; }
        .upload-area:hover { background: var(--color-white); border-color: var(--color-accent); }
        .history-list { list-style: none; margin-top: 20px; }
        .history-item { background: rgba(28,17,10,0.05); padding: 15px; border-left: 3px solid var(--color-accent); margin-bottom: 10px; display: flex; justify-content: space-between; font-size: 0.9em; }
    </style>
</head>
<body>
    <div id="login-screen">
        <div class="login-box">
            <h2 style="margin-bottom: 20px;">Acesso Restrito</h2>
            <p style="margin-bottom: 20px;">Área exclusiva para pesquisadores.</p>
            <input type="password" id="admin-pass" placeholder="Senha de Acesso">
            <button onclick="checkLogin()" class="cta-button">Entrar</button>
            <p id="login-msg" style="color: red; margin-top: 10px; font-size: 0.9em;"></p>
        </div>
    </div>

    <main id="admin-panel">
        <div class="container">
            <div class="admin-header">
                <h1>Painel de Controle</h1>
                <button onclick="logout()" style="background:none; border:1px solid var(--color-dark); color:var(--color-dark); padding:5px 15px; cursor:pointer;">Sair</button>
            </div>
            <div class="dashboard-grid">
                <div class="content-box">
                    <h2 style="color: var(--color-accent); margin-bottom: 20px;">Atualizar Base de Dados</h2>
                    <div class="upload-area" id="drop-zone">
                        <span style="font-size: 3em;">📂</span>
                        <p>Arraste o arquivo aqui ou clique para selecionar</p>
                        <input type="file" id="file-input" style="display: none;" accept=".js,.json">
                    </div>
                </div>
                <div class="content-box">
                    <h2 style="margin-bottom: 20px;">Histórico</h2>
                    <ul class="history-list" id="history-container">
                        <li style="opacity: 0.5; padding: 10px;">Nenhum registro encontrado.</li>
                    </ul>
                </div>
            </div>
        </div>
    </main>

    <script>
        const CORRECT_PASS = "itinerancias2025";
        function checkLogin() { const pass = document.getElementById('admin-pass').value; if (pass === CORRECT_PASS) { sessionStorage.setItem('isLogged', 'true'); showPanel(); } else { document.getElementById('login-msg').textContent = "Senha incorreta."; } }
        function showPanel() { document.getElementById('login-screen').style.display = 'none'; document.getElementById('admin-panel').style.display = 'flex'; loadHistory(); }
        function logout() { sessionStorage.removeItem('isLogged'); location.reload(); }
        if (sessionStorage.getItem('isLogged') === 'true') { showPanel(); }
        // (Mantenha o resto do seu JS de upload intacto)
    </script>
</body>
</html>
